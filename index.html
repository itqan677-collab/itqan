<div class="c"><h2>${role=="t"?"تقرير الطالب":"تقريري"}</h2>${role=="t"&&USERS.length?`<select onchange="cur.u=this.value;render()">${USERS.map(u=>`<option value="${u.id}"${rid()==u.id?" selected":""}>${esc(u.name)}</option>`).join("")}</select>`:""}<div class="note" style="margin-top:6px">${esc(nm(rid()))} — ${per=="w"?"الأسبوع الحالي":"الشهر الحالي"}</div>${(E=>`<div class="tl"><div><b>${my.length}</b><span>جلسات</span></div><div><b>${avg(my)==null?"—":avg(my)+"%"}</b><span>الإتقان</span></div><div><b style="color:var(--er)">${E[0]}</b><span>أخطاء</span></div><div><b style="color:var(--wa)">${E[1]}</b><span>لحون</span></div><div><b style="color:var(--in)">${E[2]}</b><span>تنبيهات</span></div></div>`)([0,1,2].map(i=>my.reduce((s,l)=>s+l.e[i],0)))}<table class="tb"><tr><th>القسم</th><th>جلسات</th><th>خطأ</th><th>لحن</th><th>تنبيه</th><th>الإتقان</th></tr>${["h","r","m"].map(k=>{const x=my.filter(l=>l.k==k);return `<tr><td>${SEC[k]}</td><td>${x.length}</td>${[0,1,2].map(i=>`<td>${x.reduce((s,l)=>s+l.e[i],0)}</td>`).join("")}<td>${avg(x)==null?"—":avg(x)+"%"}</td></tr>`}).join("")}</table><div class="row" style="margin-top:12px"><button class="g" onclick="share()">مشاركة / نسخ</button><button onclick="dlPdf()">تحميل PDF</button></div></div>
<div class="c"><h2>إنجازات الحلقة</h2>`+(F.length?F.map(l=>`<div class="li"><div class="row"><b>${esc(nm(l.u))}</b><span class="pill f0">${l.sc}%</span></div><div class="note">${SEC[l.k]}: ${rng(l)} · ${fd(l.t)}</div></div>`).join(""):`<p class="note">لا توجد إنجازات بعد.</p>`)+`</div>`}
function share(){const p=t0(per),my=mine().filter(l=>l.t>=p).sort((a,b)=>a.t-b.t);
 const t=`تقرير ${per=="w"?"أسبوعي":"شهري"} — إتقان\nحلقة ربعي بن عمرو الأنصاري\nالطالب: ${nm(rid())}\nالجلسات: ${my.length} | الإتقان: ${avg(my)==null?"—":avg(my)+"%"}\nأخطاء ${my.reduce((s,l)=>s+l.e[0],0)} | لحون ${my.reduce((s,l)=>s+l.e[1],0)} | تنبيهات ${my.reduce((s,l)=>s+l.e[2],0)}\n\n`+my.map(l=>`• ${fd(l.t)} ${SEC[l.k]}: ${rng(l)} (خ${l.e[0]} ل${l.e[1]} ت${l.e[2]})${itx(l)?" — "+itx(l):""}${l.note?" — ملاحظة: "+l.note:""}`).join("\n");
 if(navigator.share){navigator.share({text:t}).catch(()=>{})}else{try{navigator.clipboard.writeText(t).then(()=>toast("تم نسخ التقرير"),()=>toast("تعذر النسخ"))}catch(e){toast("تعذر النسخ")}}}
init();
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
